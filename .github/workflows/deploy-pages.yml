name: Deploy CFP-E Tool to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cfp-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Works with CFP as its own repository or inside the Simulations repository.
      - name: Find application directory
        id: app
        shell: bash
        run: |
          if [ -f CFP/package.json ]; then echo 'dir=CFP' >> "$GITHUB_OUTPUT"; else echo 'dir=.' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.app.outputs.dir }}
      - run: npm test
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Build static dashboard
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo '::notice::Publishing the setup screen. Add both Supabase repository variables and rerun this workflow to connect the announcement library.'
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.app.outputs.dir }}/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
